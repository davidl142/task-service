name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: tasks
          POSTGRES_DB: tasks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements*.txt

      - name: Instalar dependencias
        working-directory: api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests unitarios + cobertura
        working-directory: api
        run: python -m pytest tests/unit --cov=app --cov-report=term-missing --cov-report=xml

      - name: Tests de integración (Testcontainers/Docker)
        working-directory: api
        run: python -m pytest tests/integration -v

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detección de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Análisis estático de código (SAST - Bandit)
        run: |
          pip install bandit
          bandit -r api/app worker/app -ll

      - name: Análisis de dependencias (SCA - pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt || true
          pip-audit -r worker/requirements.txt || true
